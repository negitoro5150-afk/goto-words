function wordKey(front){return front.trim().toLowerCase();}
function validWords(words){return Array.isArray(words)&&words.length>0&&words.every(w=>w&&typeof w.front==='string'&&w.front.trim()&&typeof w.back==='string');}
function prepareDb(data){
 if(!data||!validWords(data.words))throw new Error('Invalid backup');
 const statsByFront=Object.assign(Object.create(null),data.statsByFront||{});
 if(!data.statsByFront)for(const w of data.words){const old=data.stats?.[w.id];if(old)statsByFront[wordKey(w.front)]={...old};}
 return {...data,stats:data.stats||{},statsByFront,direction:data.direction==='ja-en'?'ja-en':'en-ja'};
}

const SUPABASE_PUBLISHABLE_KEY='sb_publishable_IVMlsyQxRW7oosmcmUcNhw_GL6pAqvc';

function mergeWords(incoming){
 if(!validWords(incoming))throw new Error('Invalid words');
 const merged=new Map(db.words.map(w=>[wordKey(w.front),w]));
 for(const w of incoming){const key=wordKey(w.front);merged.set(key,{...merged.get(key),...w,created:w.created_at||w.created});}

}
async function fetchJson(url,options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 try{const response=await fetch(url,{...options,signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json();}finally{clearTimeout(timer);}
}

 }catch{
  // Keep the latest local vocabulary and progress; seed/words.json cover first use.
  try{const fallback=await fetchJson('./words.json');const present=new Set(db.words.map(w=>wordKey(w.front)));mergeWords(fallback.filter(w=>!present.has(wordKey(w.front))).length?fallback.filter(w=>!present.has(wordKey(w.front))):db.words);}catch{}
  save();rebuild();$('#syncStatus').textContent='オフライン：端末の単語で学習できます';
 }finally{syncing=false;}
}
window.addEventListener('online',syncWords);
let filter='all', listFilter='all', index=0, queue=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch{toast('端末への保存ができません。バックアップを書き出してください');} renderStats(); renderList();}
function st(w){const key=wordKey(w.front);return db.statsByFront[key]||(db.statsByFront[key]={known:0,hard:0,reviews:0,last:null});}
function recentWords(){return [...db.words].sort((a,b)=>{
 const dateA=Date.parse(a.created_at||a.created)||0,dateB=Date.parse(b.created_at||b.created)||0;
 return dateB-dateA||(Number(b.id)||0)-(Number(a.id)||0);
}).slice(0,20);}
function rebuild(shuffle=false){queue=filter==='recent'?recentWords():db.words.filter(w=>filter==='all'||st(w).hard>st(w).known); if(shuffle) queue.sort(()=>Math.random()-.5); index=Math.min(index,Math.max(0,queue.length-1)); render();}
function render(){let w=queue[index]; $('#card').classList.remove('flip'); if(!w){$('#frontText').textContent='苦手単語なし';$('#backText').textContent='すべて順調です';$('#bar').style.width='100%';return}
let rev=db.direction==='ja-en'; $('#frontText').textContent=rev?w.back.split('｜')[0]:w.front; $('#backText').textContent=rev?w.front:w.back;
$('#frontLabel').textContent=rev?'JAPANESE':'ENGLISH';$('#backLabel').textContent=rev?'ENGLISH':'JAPANESE';
$('#bar').style.width=((index+1)/queue.length*100)+'%';$('#headerCount').textContent=`${index+1} / ${queue.length}`;}
function renderStats(){let vals=Object.values(db.statsByFront);$('#knownN').textContent=vals.filter(x=>x.known>x.hard).length;$('#hardN').textContent=vals.filter(x=>x.hard>x.known).length;$('#reviewN').textContent=vals.reduce((a,x)=>a+x.reviews,0)}
function renderList(){let q=($('#search')?.value||'').toLowerCase(); let a=(listFilter==='recent'?recentWords():db.words).filter(w=>(w.front+' '+w.back).toLowerCase().includes(q));$('#wordList').innerHTML=a.map(w=>{let s=st(w);return `<div class="row"><div><b>${esc(w.front)}</b><span>${esc(w.back)}</span></div>${s.hard>s.known?'<div class="badge">苦手</div>':''}</div>`}).join('')}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rate(kind){let w=queue[index];if(!w)return;let s=st(w);s[kind]++;s.reviews++;s.last=Date.now();save();toast(kind==='known'?'覚えた ✓':'苦手に追加'); if(index<queue.length-1)index++; else index=0;rebuild();}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),900)}
$('#card').onclick=()=>$('#card').classList.toggle('flip');$('#knownBtn').onclick=()=>rate('known');$('#hardBtn').onclick=()=>rate('hard');
$$('.pill[data-filter]').forEach(b=>b.onclick=()=>{$$('.pill[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;index=0;rebuild()});
$$('.pill[data-list-filter]').forEach(b=>b.onclick=()=>{$$('.pill[data-list-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');listFilter=b.dataset.listFilter;renderList()});
$('#direction').onclick=()=>{db.direction=db.direction==='en-ja'?'ja-en':'en-ja';$('#direction').textContent=db.direction==='en-ja'?'英 → 日':'日 → 英';save();render()};
$('#shuffle').onclick=()=>{index=0;rebuild(true);toast('シャッフルしました')};
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');renderList()});
$('#search').oninput=renderList;
$('#addBtn').onclick=()=>{let f=$('#newFront').value.trim(),b=$('#newBack').value.trim();if(!f||!b)return toast('英語と意味を入力してください');let id=Math.max(0,...db.words.map(x=>Number(x.id)||0))+1;db.words.unshift({id,front:f,back:b,source:'manual',created:new Date().toISOString()});$('#newFront').value='';$('#newBack').value='';save();rebuild();toast('追加しました')};
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='goto-words-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('#importFile').onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=prepareDb(JSON.parse(r.result));save();rebuild();$('#direction').textContent=db.direction==='en-ja'?'英 → 日':'日 → 英';toast('読み込みました')}catch{toast('ファイルを確認してください')}};r.readAsText(e.target.files[0])};
let sx=0;$('#card').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('#card').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){index=(index+(dx<0?1:-1)+queue.length)%queue.length;render()}},{passive:true});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
$('#direction').textContent=db.direction==='en-ja'?'英 → 日':'日 → 英';
rebuild();renderStats();renderList();syncWords();
</script></body></html>
